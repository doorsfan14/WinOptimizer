name: Build release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore and test
        run: |
          dotnet restore .\tests\WinOptimizer.Tests\WinOptimizer.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\WinOptimizer.Tests\WinOptimizer.Tests.csproj --configuration Release --no-restore
          node .\tests\WinOptimizer.Tests\website.test.mjs
      - name: Publish x64 app folder
        run: dotnet publish .\src\WinOptimizer.App\WinOptimizer.App.csproj --configuration Release --runtime win-x64 --self-contained false --output .\artifacts\publish\win-x64
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\publish\win-x64\* -DestinationPath .\artifacts\WinOptimizer-portable-win-x64.zip
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build per-user installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\installer\WinOptimizer.iss'
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/WinOptimizer-portable-win-x64.zip
            artifacts/installer/WinOptimizer-Setup-0.1.0-win-x64.exe
